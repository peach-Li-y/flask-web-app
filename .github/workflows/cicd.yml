name: Deploy Flask App to Touge Server
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.4.1
          pytest tests/ -v
        continue-on-error: false
      - name: Sleep short time to avoid SSH MaxStartups limit
        run: sleep 10
      - name: Deploy to Touge Server via SSH (Port 41769)
        run: |
          # 配置SSH环境
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.TOUGE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 41769 -H ${{ secrets.TOUGE_SERVER_IP }} >> ~/.ssh/known_hosts
          echo "SSH环境配置完成，尝试连接服务器..."
          # 把本地最新代码上传到服务器，替代git pull
          scp \
            -P 41769 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -r ./* root@${{ secrets.TOUGE_SERVER_IP }}:/root/flask-web-app/

          ssh \
            -p 41769 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            root@${{ secrets.TOUGE_SERVER_IP }} << 'EOF'
              set +e
              echo "成功连接服务器：$(whoami)@$(hostname)"
              cd /root/flask-web-app || { echo "项目目录不存在"; exit 1; }
              pip3 install --upgrade pip
              pip3 install -r requirements.txt || { echo "依赖安装失败"; exit 1; }
              # 杀死旧gunicorn进程
              pkill -9 -f gunicorn || true
              # 进入src目录启动服务
              cd src
              nohup /usr/local/bin/gunicorn -w 4 -b 0.0.0.0:5000 app:app > /root/app.log 2>&1 &
              sleep 3
              echo "部署完成，服务已后台启动"
          EOF
        env:
          TOUGE_SSH_PRIVATE_KEY: ${{ secrets.TOUGE_SSH_PRIVATE_KEY }}
          TOUGE_SERVER_IP: ${{ secrets.TOUGE_SERVER_IP }}
